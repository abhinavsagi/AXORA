ex;align-items:flex-start;justify-content:center;padding:40px clamp(24px,4vw,64px);background:linear-gradient(180deg,#06101a,#040a11);overflow-y:auto;min-height:100vh}.login-card{margin:0 auto;width:min(500px,100%);overflow:visible;max-height:none;overflow:visible;scrollbar-width:auto}.demo-note{margin-top:20px!important;padding:12px 14px!important;line-height:1.55!important;position:relative;z-index:1;border:1px solid #1b4966;background:linear-gradient(135deg,#0a1d2c,#081521);border-radius:10px;text-align:center;color:#8fa9bf;font-size:11px}.footer-note{margin-top:18px!important;padding-top:12px!important;position:relative;z-index:1}.login-content h1{font-size:clamp(52px,6vw,74px);letter-spacing:clamp(7px,1vw,12px);margin:22px 0 8px}.tagline{font-size:27px;font-weight:700}.tagline span{color:var(--blue)}.login-content p{color:#a6bbd0;line-height:1.65;max-width:650px}.floaters{display:flex;gap:12px;margin-top:34px}.float{background:#071624d9;border:1px solid #1d4966;border-radius:12px;padding:13px 15px;min-width:155px}.float small{display:block;color:var(--muted);font-size:10px}.float b{display:block;margin-top:7px}.login-card{width:min(500px,100%);margin:0 auto 20px;background:rgba(7,19,32,.96);border:1px solid #23435f;border-radius:22px;padding:30px;box-shadow:0 25px 80px #000b}.login-card h2{margin:12px 0 6px;font-size:28px;letter-spacing:-.4px}.login-card p{color:var(--muted);font-size:12px}.field{margin:13px 0}.field label{display:block;color:#9fb3c8;font-size:11px;margin-bottom:7px}.field input,.select{width:100%;padding:13px;border:1px solid #25435d;border-radius:10px;background:#07111d;color:white;outline:none}.field input:focus{border-color:var(--blue)}.full{width:100%;margin-top:5px}.or{display:flex;align-items:center;gap:10px;color:#657d94;font-size:11px;margin:17px 0}.or:before,.or:after{content:"";height:1px;background:#ffffff12;flex:1}.social{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0}.footer-note{text-align:center;color:#5f768 <body>
<div id="root"></div><div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const state={page:'login',risk:72,energy:84.6,health:92,alerts:3,live:true,api:'connecting',history:[]};
const AXORA_API = (window.location.protocol === 'file:') ? 'http://127.0.0.1:8000/api' : '/api';
async function apiGet(path){const r=await fetch(AXORA_API+path);if(!r.ok)throw new Error('API '+r.status);return r.json()}
async function apiPost(path,payload){const r=await fetch(AXORA_API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error('API '+r.status);return r.json()}
const demoFallback={telemetry:{temperature:84.2,pressure:6.8,vibration:4.2,power_kw:48.7,production_rate:126,energy_per_unit:3.84},analysis:{risk:72,confidence:94.1,severity:'warning',deviations:{temperature:8,pressure:6.25,vibration:50,power_kw:15.95,production_rate:-3.08,energy_per_unit:18.15},contributors:[{name:'Energy deviation',deviation_pct:18.15},{name:'Thermal drift',deviation_pct:8},{name:'Vibration',deviation_pct:50}],prediction_horizon_min:18,defect_probability:72,recommendations:['Reduce operating load by 5–8% and compare energy/unit against baseline.','Inspect heating-cycle control and temperature sensor calibration.']},energy_efficiency:90.0,process_health:92};
async function getAXORA(){try{const d=await apiGet('/dashboard');state.api='online';return d}catch(e){state.api='offline';return demoFallback}}
async function getAXORATelemetry(){try{const d=await apiGet('/telemetry');state.api='online';return d}catch(e){state.api='offline';return demoFallback}}

const root=document.getElementById('root');
function logo(){return `<div class="brand"><span class="brandmark"></span>AXORA</div>`}
function login(){root.innerHTML=`<div class="login"><section class="login-left"><div class="login-content">${logo()}<div class="eyebrow" style="margin-top:34px">ENERGY-TO-QUALITY INTELLIGENCE</div><h1>AXORA</h1><div class="tagline">From Energy Signals <span>to Quality Confidence</span></div><p>AI-powered process intelligence that detects deviations, forecasts quality risk, and identifies energy inefficiency before it becomes costly output.</p><div class="floaters"><div class="float"><small>ENERGY CONSUMPTION</small><b class="blue">+12.4%</b></div><div class="float"><small>QUALITY RISK</small><b class="danger">HIGH · 72%</b></div><div class="float"><small>PROCESS HEALTH</small><b class="up">92%</b></div></div></div></section><section class="login-right"><div class="login-card"><div style="text-align:center"><div class="auth-brand">${logo()}</div><div class="auth-kicker"><span>●</span> Secure production access</div><h2 id="authTitle">Welcome back</h2><p id="authSubtitle">Access your production intelligence workspace.</p></div><div class="auth-switch"><button id="signinTab" class="active" onclick="setAuthMode('signin')">Sign in</button><button id="signupTab" onclick="setAuthMode('signup')">Create account</button></div><div id="authFields"><div class="field"><label>USERNAME OR EMAIL</label><div class="input-wrap"><span class="input-icon">◉</span><input id="authUser" autocomplete="username" placeholder="operator@factory.com"></div></div><div class="field"><label>PASSWORD</label><div class="input-wrap"><span class="input-icon">◆</span><input id="authPassword" type="password" autocomplete="current-password" placeholder="Enter your password"><button class="password-toggle" type="button" onclick="togglePassword()" aria-label="Show password">◉</button></div><div class="helper-row"><span><input id="rememberMe" type="checkbox" style="accent-color:#16a9ff;vertical-align:middle;margin-right:5px"> Remember me</span><button class="link-btn" onclick="forgotPassword()">Forgot password?</button></div></div><div id="authMessage" class="auth-message"></div><button class="button full" id="authSubmit" onclick="submitAuth()">Sign In →</button><div class="or">or continue with</div><div class="social"><button class="button secondary google-btn" onclick="googleDemo()">G&nbsp;&nbsp; Continue with Google</button><button class="button secondary" onclick="microsoftDemo()">▦&nbsp;&nbsp; Microsoft</button></div><div id="demoAccess" class="demo-note">DEMO ACCESS&nbsp;&nbsp; <b style="color:#b9d8ee">operator@factory.com</b>&nbsp;&nbsp; · &nbsp;&nbsp;<b style="color:#b9d8ee">AXORA@1234</b></div><div class="footer-note">AXORA Intelligence Platform&nbsp; · &nbsp;Secure workspace</div></div></div></section></div>`;window.authMode='signin';}
function togglePassword(){const el=document.getElementById('authPassword');if(!el)return;el.type=el.type==='password'?'text':'password';const b=document.querySelector('.password-toggle');if(b)b.textContent=el.type==='password'?'◉':'◌';}

function setAuthMode(mode){window.authMode=mode;const sign=document.getElementById('signinTab'),up=document.getElementById('signupTab'),title=document.getElementById('authTitle'),sub=document.getElementById('authSubtitle'),submit=document.getElementById('authSubmit'),fields=document.getElementById('authFields'),msg=document.getElementById('authMessage');if(!sign)return;sign.classList.toggle('active',mode==='signin');up.classList.toggle('active',mode==='signup');msg.textContent='';const demo=document.getElementById('demoAccess');if(demo)demo.style.display=mode==='signup'?'none':'block';if(mode==='signup'){title.textContent='Create your account';sub.textContent='Set up your AXORA production workspace.';fields.innerHTML=`<div class="field"><label>FULL NAME</label><div class="input-wrap"><span class="input-icon">◉</span><input id="authName" autocomplete="name" placeholder="Your name"></div></div><div class="field"><label>EMAIL ADDRESS</label><div class="input-wrap"><span class="input-icon">@</span><input id="authUser" type="email" autocomplete="email" placeholder="you@company.com"></div></div><div class="field"><label>PASSWORD</label><div class="input-wrap"><span class="input-icon">◆</span><input id="authPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters"><button class="password-toggle" type="button" onclick="togglePassword()">◉</button></div></div>`;submit.textContent='Create Account →';}else{title.textContent='Welcome back';sub.textContent='Access your production intelligence workspace.';fields.innerHTML=`<div class="field"><label>USERNAME OR EMAIL</label><input id="authUser" autocomplete="username" placeholder="operator@factory.com"></div><div class="field"><label>PASSWORD</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="helper-row"><span>Demo account: operator@factory.com</span><button class="link-btn" onclick="forgotPassword()">Forgot password?</button></div>`;submit.textContent='Sign In →';}}
async function submitAuth(){const msg=document.getElementById('authMessage');msg.textContent='';const user=(document.getElementById('authUser')?.value||'').trim();const pass=(document.getElementById('authPassword')?.value||'');try{if(window.authMode==='signup'){const name=(document.getElementById('authName')?.value||'').trim();if(!name||!user||!pass){msg.textContent='Please complete all fields.';return}if(pass.length<8){msg.textContent='Password must be at least 8 characters.';return}const r=await apiPost('/auth/signup',{name,email:user,password:pass});state.user=r.user;localStorage.setItem('axora_token',r.token);showToast('Account created successfully');await enterApp();}else{if(!user||!pass){msg.textContent='Enter your username/email and password.';return}const r=await apiPost('/auth/login',{identifier:user,password:pass});state.user=r.user;localStorage.setItem('axora_token',r.token);showToast('Signed in successfully');await enterApp();}}catch(e){msg.textContent=e.message.includes('API')?'Backend unavailable. Start FastAPI first.':(e.detail||e.message||'Authentication failed.');}}

function shell(content,title,sub){root.innerHTML=`<div class="app"><header class="topbar">${logo()}<nav class="nav">${['dashboard','process','risk','alerts','analytics','recommendations','settings'].map(x=>`<button class="${state.page===x?'active':''}" onclick="navigate('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</nav><div class="user"><span class="live">● LIVE DATA</span><div class="avatar">AS</div></div></header><main class="page">${content}</main></div>`}
function header(eyebrow,title,sub){return `<div class="hero"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div><div class="facility">Plant A · Line 04 &nbsp; <span class="up">● Operational</span></div></div>`}
async function dashboard(){const d=await getAXORA();const t=d.telemetry,a=d.analysis;state.risk=a.risk;state.energy=d.energy_efficiency;state.health=d.process_health;state.history=[];pushHistory(d);shell(`${header('OPERATIONS INTELLIGENCE','Good afternoon, Abhinav','AXORA is continuously analyzing machine energy and process signals.')}<div class="grid kpis backend-kpis"><div class="card"><div class="kpi-title">Energy Efficiency</div><div class="kpi" id="kpi-energy">${d.energy_efficiency}%</div><div class="trend up">Calculated from current energy/unit deviation</div></div><div class="card"><div class="kpi-title">Quality Risk</div><div class="kpi" id="kpi-risk">${a.risk}%</div><div class="trend ${a.risk>=55?'warn':'up'}">● ${a.severity==='critical'?'HIGH':a.severity==='warning'?'ELEVATED':'NORMAL'} · predicted defect risk</div></div><div class="card"><div class="kpi-title">Process Health</div><div class="kpi" id="kpi-health">${d.process_health}%</div><div class="trend up">Derived from current risk state</div></div><div class="card"><div class="kpi-title">Energy / Unit</div><div class="kpi" id="kpi-epu">${t.energy_per_unit.toFixed(2)} <small style="font-size:13px;color:#8ca6ba">kWh</small></div><div class="trend ${a.deviations.energy_per_unit>0?'warn':'up'}">▲ ${Math.abs(a.deviations.energy_per_unit).toFixed(1)}% vs baseline</div></div></div><div class="grid main-grid"><div class="card"><div class="card-head"><h3>Energy vs Quality Risk</h3><span class="pill">Live backend analysis</span></div>${liveChart()}<div class="legend"><span><i class="dot" style="background:#16a9ff"></i>Energy / Unit</span><span><i class="dot" style="background:#ff8a38"></i>Quality Risk</span></div></div><div class="card"><div class="card-head"><h3>Active AI alerts</h3><span class="badge ${a.risk>=75?'b-red':'b-orange'}">${a.risk>=55?'ACTIVE':'CLEAR'}</span></div>${alert('Quality risk '+a.risk+'%',`Prediction horizon ${a.prediction_horizon_min} min.`,a.confidence+'% confidence')} ${alert('Energy deviation',`${a.deviations.energy_per_unit.toFixed(1)}% above baseline.`,t.energy_per_unit.toFixed(2)+' kWh/unit')} ${alert('Top contributor',a.contributors[0]?.name||'Process signal','AI ranked')}</div></div>
<div class="grid main-grid" style="margin-top:16px"><div class="ai-box"><div class="score"><div class="ring"><span>${a.risk}%</span></div><div><div class="eyebrow">AXORA AI RISK ENGINE</div><h3>Quality deviation predicted</h3><p>Current process telemetry indicates an elevated probability of quality deviation within the next <b style="color:#fff">${a.prediction_horizon_min} minutes</b>.</p><p style="font-size:11px;color:#9fb3c8">Model confidence: ${a.confidence}% · Defect probability: ${a.defect_probability}%</p></div></div><button class="button" onclick="navigate('risk')" style="margin-top:15px">Open AI Analysis →</button></div><div class="card"><div class="card-head"><h3>Recommended action</h3><span class="pill">AI generated</span></div><p style="color:#cbd9e7;font-size:13px;line-height:1.6">${a.recommendations[0]}</p><button class="button secondary" onclick="showToast('Recommendation acknowledged')">Acknowledge</button></div></div>`, '','')}
function liveChart(){return `<div class="chart" id="live-chart"><svg viewBox="0 0 800 250" preserveAspectRatio="none"><polyline id="live-energy-line" fill="none" stroke="#16a9ff" stroke-width="4" points=""/><polyline id="live-risk-line" fill="none" stroke="#ff8a38" stroke-width="4" points=""/><circle id="live-energy-dot" cx="799" cy="125" r="5" fill="#16a9ff"/><circle id="live-risk-dot" cx="799" cy="125" r="5" fill="#ff8a38"/></svg></div>`}
function pushHistory(d){state.history.push({energy:d.telemetry.energy_per_unit,risk:d.analysis.risk});if(state.history.length>24)state.history.shift()}
function updateLiveChart(){const el=document.getElementById('live-chart');if(!el||!state.history.length)return;const n=state.history.length,w=800,h=250;const xs=state.history.map((_,i)=>n===1?w/2:i*(w/(n-1)));const energyVals=state.history.map(x=>x.energy);const emin=Math.min(...energyVals)-0.1,emax=Math.max(...energyVals)+0.1;const mapEnergy=v=>h-20-((v-emin)/(emax-emin||1))*(h-40);const mapRisk=v=>h-20-(v/100)*(h-40);const ep=state.history.map((x,i)=>`${xs[i]},${mapEnergy(x.energy)}`).join(' ');const rp=state.history.map((x,i)=>`${xs[i]},${mapRisk(x.risk)}`).join(' ');document.getElementById('live-energy-line').setAttribute('points',ep);document.getElementById('live-risk-line').setAttribute('points',rp);const last=state.history[state.history.length-1];document.getElementById('live-energy-dot').setAttribute('cx',xs[xs.length-1]);document.getElementById('live-energy-dot').setAttribute('cy',mapEnergy(last.energy));document.getElementById('live-risk-dot').setAttribute('cx',xs[xs.length-1]);document.getElementById('live-risk-dot').setAttribute('cy',mapRisk(last.risk));}
function chart(){let p1=[55,60,52,66,70,62,76,72,80,86,78,88,82,92,89,96,93,98];let p2=[30,35,33,42,39,46,48,45,55,52,58,61,64,63,69,72,68,72];return `<div class="chart"><svg viewBox="0 0 800 250" preserveAspectRatio="none"><polyline fill="none" stroke="#16a9ff" stroke-width="4" points="${p1.map((y,i)=>`${i*47},${250-y*2.1}`).join(' ')}"/><polyline fill="none" stroke="#ff8a38" stroke-width="4" points="${p2.map((y,i)=>`${i*47},${250-y*2.1}`).join(' ')}"/><circle cx="799" cy="45" r="5" fill="#16a9ff"/><circle cx="799" cy="99" r="5" fill="#ff8a38"/></svg></div>`}
